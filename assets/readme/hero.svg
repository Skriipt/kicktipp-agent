<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">kicktipp-agent</title>
  <desc id="desc">kicktipp-agent: your Kicktipp prediction pool from the terminal or your AI assistant. A prediction slip shows one filled score field and an empty field waiting for a keyboard entry.</desc>

  <rect width="1200" height="380" rx="26" fill="#0c1411"/>
  <path d="M0 26a26 26 0 0 1 26-26h8v380h-8a26 26 0 0 1-26-26z" fill="#3ddc7a"/>

  <g id="title-block" font-family="ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace">
    <text x="64" y="92" font-size="20" letter-spacing="3" fill="#8ba093">KICKTIPP  ·  TUI  ·  CLI  ·  MCP</text>
    <text x="64" y="178" font-size="72" font-weight="700" fill="#eaf2ed">kicktipp<tspan fill="#3ddc7a">-agent</tspan></text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#eaf2ed">
      <text x="64" y="240">Your prediction pool,</text>
      <text x="64" y="282">from the terminal or your AI assistant.</text>
    </g>
    <text x="64" y="334" font-size="20" fill="#8ba093">plain HTTP  ·  no browser  ·  runs locally</text>
  </g>

  <g id="prediction-slip" font-family="ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace">
    <rect x="720" y="48" width="416" height="284" rx="16" fill="#121d18" stroke="#243630" stroke-width="2"/>
    <text x="744" y="90" font-size="22" font-weight="700" fill="#3ddc7a">Prediction</text>
    <text x="1112" y="90" font-size="18" fill="#8ba093" text-anchor="end">kickoff in 4h 36m</text>
    <path d="M744 110H1112" stroke="#243630" stroke-width="2"/>

    <g font-size="20">
      <text x="744" y="154" fill="#eaf2ed">Bayern vs Dortmund</text>
      <rect x="1016" y="130" width="96" height="36" rx="6" fill="#0c1411" stroke="#3ddc7a" stroke-width="2"/>
      <text x="1064" y="156" fill="#3ddc7a" text-anchor="middle" font-weight="700">2:1</text>

      <text x="728" y="204" fill="#f4c430" font-weight="700">&gt;</text>
      <text x="744" y="204" fill="#eaf2ed">Köln vs Hoffenheim</text>
      <rect x="1016" y="180" width="96" height="36" rx="6" fill="#eaf2ed"/>
      <text x="1064" y="206" fill="#0c1411" text-anchor="middle" font-weight="700">_:_</text>

      <text x="744" y="254" fill="#eaf2ed">Leipzig vs Gladbach</text>
      <rect x="1016" y="230" width="96" height="36" rx="6" fill="#0c1411" stroke="#243630" stroke-width="2"/>
      <text x="1064" y="256" fill="#8ba093" text-anchor="middle">_:_</text>
    </g>

    <text x="744" y="304" font-size="18" fill="#8ba093">s suggest   a fill   w submit</text>
  </g>
</svg>
