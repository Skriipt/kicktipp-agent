<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Kicktipp – Tipps, Analysen und Erinnerungen an einem Ort.">
  <title>Kicktipp · Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#content">Zum Inhalt</a>
  <aside id="sidebar">
    <button id="menu-close" class="icon-button" aria-label="Navigation schließen">×</button>
    <a href="/" class="brand" aria-label="Kicktipp Startseite"><span class="brand-icon">k.</span><span>kicktipp<span class="brand-sub">PROJEKT-DASHBOARD</span></span></a>
    <nav id="navigation" aria-label="Hauptnavigation"></nav>
    <div class="sidebar-foot"><span class="connection-dot"></span> Lokal verbunden<span id="version"></span></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button id="menu" class="icon-button" aria-label="Navigation öffnen" aria-expanded="false">☰</button>
      <div id="breadcrumb">Dashboard</div>
      <div class="context"><label for="profile">Konto</label><select id="profile" aria-label="Aktives Konto"><option value="">Standardprofil</option></select><span id="community-badge" class="badge">Keine Community</span></div>
    </header>
    <main id="content" tabindex="-1"><div class="empty"><div class="loader"></div><h1>Dashboard wird geladen</h1><p>Lokale Konfiguration wird gelesen.</p></div></main>
    <footer>Deine Tipps. Deine Einstellungen. <span>Speicherung auf diesem Rechner.</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirmation" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Aktion bestätigen</h2>
    <p id="confirm-context"></p>
    <pre id="confirm-detail"></pre>
    <div class="actions"><button id="confirm-cancel" class="secondary">Abbrechen</button><button id="confirm-submit">Bestätigen</button></div>
  </dialog>
</body>
</html>
