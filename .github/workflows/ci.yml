name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The MCP integration tests start the compiled dist/server.js.
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
      - run: docker compose build
      - run: node scripts/smoke-container.mjs
