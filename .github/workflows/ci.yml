name: CI

on:
  pull_request:
  push:
    branches: [main, 'dev/**']

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24', '26']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run pack:mcpb

  docker-smoke:
    name: Docker release smoke
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm run test:docker
